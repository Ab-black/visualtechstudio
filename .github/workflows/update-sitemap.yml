name: Update sitemap

on:
  push:
    branches:
      - main
    paths:
      - "dashboard/supabase-config.js"
      - ".github/scripts/generate-sitemap.mjs"
      - ".github/workflows/update-sitemap.yml"
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate sitemap from published products
        run: node .github/scripts/generate-sitemap.mjs

      - name: Commit sitemap if changed
        run: |
          if git diff --quiet -- sitemap.xml; then
            echo "Sitemap is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "chore: update sitemap"
          git push
