<!doctype html>
<html lang="en">
<head>
    <link rel="icon" type="image/jpg" href="../images/logo.jpg">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Visual Tech Studio customer account authentication.">
<title>Customer Account — Visual Tech Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/public-pages.css">
<link rel="stylesheet" href="../css/desktop-overrides.css">
<style>
.account-neumorphic-page{
    min-height:calc(100vh - 84px);
    background:#e7ebee;
    color:#28343b;
}
.account-neumorphic-page .account-wrap{
    max-width:none;
    min-height:calc(100vh - 84px);
    margin:0;
    padding:clamp(42px,7vw,88px) 24px 96px;
    display:grid;
    place-items:center;
    position:relative;
    overflow:hidden;
}
.account-neumorphic-page .account-wrap::before,
.account-neumorphic-page .account-wrap::after{
    content:"";
    position:absolute;
    border-radius:50%;
    pointer-events:none;
    filter:blur(2px);
}
.account-neumorphic-page .account-wrap::before{
    width:420px;
    height:420px;
    top:-180px;
    right:-120px;
    background:rgba(255,255,255,.34);
}
.account-neumorphic-page .account-wrap::after{
    width:360px;
    height:360px;
    bottom:-180px;
    left:-120px;
    background:rgba(195,202,207,.22);
}
.account-neumorphic-page .eyebrow{
    position:absolute;
    top:30px;
    left:50%;
    transform:translateX(-50%);
    margin:0;
    color:#65727a;
    font:700 .68rem/1 Inter,sans-serif;
    letter-spacing:.2em;
    white-space:nowrap;
    z-index:2;
}
.account-neumorphic-page .account-panel{
    position:relative;
    z-index:3;
    width:min(78vw,680px);
    aspect-ratio:1;
    min-height:0;
    margin:0 auto;
    border:0;
    border-radius:50%;
    background:transparent;
    box-shadow:none;
    transform-style:preserve-3d;
    transform:perspective(1400px) rotateY(0deg);
    transition:transform .64s ease-in-out;
}
.account-neumorphic-page .account-face{
    position:absolute;
    inset:0;
    box-sizing:border-box;
    padding:clamp(78px,8vw,108px) clamp(92px,10vw,124px);
    border-radius:50%;
    background:#e7ebee;
    box-shadow:
        18px 18px 38px rgba(163,171,176,.62),
        -18px -18px 38px rgba(255,255,255,.92),
        inset 1px 1px 0 rgba(255,255,255,.36);
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    overflow:hidden;
}
.account-neumorphic-page .account-face::before{
    content:"";
    position:absolute;
    inset:10px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.22);
    pointer-events:none;
}
.account-neumorphic-page .account-face-back{
    transform:rotateY(180deg);
}
.account-neumorphic-page .account-panel.is-flipping{
    transform-style:preserve-3d;
}
@keyframes account-content-in{
    from{opacity:.72;transform:translateY(4px)}
    to{opacity:1;transform:translateY(0)}
}
@media(max-width:700px){\n    .account-neumorphic-page .account-panel{\n        width:min(100%,520px);\n        aspect-ratio:auto;\n        min-height:0;\n        padding:34px 22px 30px;\n        border-radius:32px;\n    }\n    .account-neumorphic-page .account-panel::before{\n        inset:10px;\n        border-radius:25px;\n    }\n    .account-neumorphic-page .account-panel.is-flipping::after{\n        border-radius:32px;\n    }
    .account-neumorphic-page .account-wrap{
        padding:55px 18px 72px;
        place-items:start center;
    }
    .account-neumorphic-page .eyebrow{
        top:24px;
    }
    .account-neumorphic-page .account-panel{
        width:min(100%,520px);
        min-height:0;
        margin-top:18px;
        padding:40px 25px 36px;
        border-radius:32px;
        box-shadow:
            13px 13px 28px rgba(163,171,176,.58),
            -13px -13px 28px rgba(255,255,255,.9);
    }
    .account-neumorphic-page .account-panel::before{
        border-radius:25px;
    }
    .account-neumorphic-page .account-panel.is-flipping::after{
        border-radius:32px;
    }
}

    .account-neumorphic-page .account-form{
        gap:13px;
        margin-top:24px;
    }
    .account-neumorphic-page .account-form input{
        height:50px;
    }
    .account-neumorphic-page .account-actions button{
        min-height:48px;
    }
    .account-neumorphic-page .account-link{
        margin-top:16px;
    }
@media(max-width:500px){
    .account-neumorphic-page .account-wrap{
        padding-left:14px;
        padding-right:14px;
    }
    .account-neumorphic-page .account-panel{
        padding:35px 20px 30px;
    }
    .account-neumorphic-page .account-panel h1{
        font-size:2.65rem;
    }
    .account-neumorphic-page .account-actions{
        grid-template-columns:1fr;
    }
}
@media(prefers-reduced-motion:reduce){
    .account-neumorphic-page .account-panel.is-flipping,
    .account-neumorphic-page .account-panel.is-flipping::after,
    .account-neumorphic-page .account-form,
    .account-neumorphic-page .account-status,
    .account-neumorphic-page .account-link{
        animation:none;
    }
}
.is-hidden{display:none!important}
</style>
</head>

<nav class="site-nav"><a class="logo" href="../index.html"><img src="../images/logo.jpg" alt="Visual Tech Studio logo"><span>Visual Tech Studio</span></a><button class="menu-toggle" aria-expanded="false" aria-controls="primary-menu"><span></span><span></span></button><div class="nav-menu" id="primary-menu"><ul><li><a href="../work/">Projects</a></li><li><a href="../services/">Services</a></li><li><a href="../studio/">Studio</a></li><li><a href="../resources/">Resources</a></li><li><a href="../store/">Store</a></li></ul><a href="../contact/" class="nav-cta">Start a Project</a></div></nav>
<main class="public-page account-neumorphic-page"><section class="page-hero account-wrap"><div class="account-panel" id="account-panel">
<div class="account-face account-face-front is-active">
<h1 id="account-heading" data-account-id="account-heading">Your account.</h1>
<p class="page-lead" id="account-lead" data-account-id="account-lead">Sign in to your account.</p>
<div id="account-message" data-account-id="account-message" class="account-message is-hidden" role="alert" aria-live="polite"></div>
<form id="account-form" data-account-id="account-form" class="account-form">
<label><span>Email address</span><input id="email" data-account-id="email" type="email" autocomplete="email" required maxlength="254" placeholder="you@example.com"></label>
<label id="password-field" data-account-id="password-field"><span>Password</span><input id="password" data-account-id="password" type="password" autocomplete="current-password" minlength="8" maxlength="72" placeholder="Enter your password"></label>
<label id="confirm-password-field" data-account-id="confirm-password-field" class="is-hidden"><span>Confirm password</span><input id="confirm-password" data-account-id="confirm-password" type="password" autocomplete="new-password" minlength="8" maxlength="72" placeholder="Confirm your password"></label>
<div id="forgot-row" data-account-id="forgot-row" class="account-secondary"><button id="forgot-button" data-account-id="forgot-button" type="button">Forgot password?</button></div>
<div class="account-actions" id="auth-actions" data-account-id="auth-actions"><button class="btn-primary" id="submit-button" data-account-id="submit-button" type="submit">Sign in</button><button class="btn-secondary" id="signup-button" data-account-id="signup-button" type="button">Create account</button></div>
<div id="confirmation-actions" data-account-id="confirmation-actions" class="account-secondary is-hidden"><button id="resend-confirmation-button" data-account-id="resend-confirmation-button" type="button">Resend confirmation email</button></div>

</form>
<div id="signed-in-state" data-account-id="signed-in-state" class="account-status is-hidden">
<div class="account-status-card"><strong>Signed in</strong><span id="signed-in-email" data-account-id="signed-in-email"></span></div>
<div class="account-actions single"><button class="btn-primary" id="return-button" data-account-id="return-button" type="button">Continue</button><button class="btn-secondary" id="signout-button" data-account-id="signout-button" type="button">Sign out</button></div>
</div>
<a class="account-link" href="../store/">← Return to Store</a>
</div>
<div class="account-face account-face-back">
<h1 id="back-account-heading" data-account-id="account-heading">Your account.</h1>
<p class="page-lead" id="back-account-lead" data-account-id="account-lead">Sign in to your account.</p>
<div id="back-account-message" data-account-id="account-message" class="account-message is-hidden" role="alert" aria-live="polite"></div>
<form id="back-account-form" data-account-id="account-form" class="account-form">
<label><span>Email address</span><input id="back-email" data-account-id="email" type="email" autocomplete="email" required maxlength="254" placeholder="you@example.com"></label>
<label id="back-password-field" data-account-id="password-field"><span>Password</span><input id="back-password" data-account-id="password" type="password" autocomplete="current-password" minlength="8" maxlength="72" placeholder="Enter your password"></label>
<label id="back-confirm-password-field" data-account-id="confirm-password-field" class="is-hidden"><span>Confirm password</span><input id="back-confirm-password" data-account-id="confirm-password" type="password" autocomplete="new-password" minlength="8" maxlength="72" placeholder="Confirm your password"></label>
<div id="back-forgot-row" data-account-id="forgot-row" class="account-secondary"><button id="back-forgot-button" data-account-id="forgot-button" type="button">Forgot password?</button></div>
<div class="account-actions" id="back-auth-actions" data-account-id="auth-actions"><button class="btn-primary" id="back-submit-button" data-account-id="submit-button" type="submit">Sign in</button><button class="btn-secondary" id="back-signup-button" data-account-id="signup-button" type="button">Create account</button></div>
<div id="back-confirmation-actions" data-account-id="confirmation-actions" class="account-secondary is-hidden"><button id="back-resend-confirmation-button" data-account-id="resend-confirmation-button" type="button">Resend confirmation email</button></div>

</form>
<div id="back-signed-in-state" data-account-id="signed-in-state" class="account-status is-hidden">
<div class="account-status-card"><strong>Signed in</strong><span id="back-signed-in-email" data-account-id="signed-in-email"></span></div>
<div class="account-actions single"><button class="btn-primary" id="back-return-button" data-account-id="return-button" type="button">Continue</button><button class="btn-secondary" id="back-signout-button" data-account-id="signout-button" type="button">Sign out</button></div>
</div>
<a class="account-link" href="../store/">← Return to Store</a>
</div>
</div></section></main>
<script src="../js/script.js"></script>
<script src="../dashboard/supabase-config.js"></script>
<script src="../js/auth-navigation.js"></script>
<script>
(() => {
    const $ = id => document.querySelector(`.account-face-${activeFace} [data-account-id="${id}"]`) || document.getElementById(id);
    const params = new URLSearchParams(window.location.search);
    const recoveryRequested = params.get('reset') === '1';
    const emailConfirmed = !recoveryRequested && window.location.hash.includes('access_token=');
    let client = null;
    let mode = params.get('signup') === '1' ? 'signup' : 'signin';
    let busy = false;

    const safeReturnPath = value => {
        if (!value) return '../store/';
        try {
            const decoded = decodeURIComponent(value);
            if (!decoded.startsWith('../') || decoded.startsWith('//') || decoded.includes('\\') || /^[a-z][a-z0-9+.-]*:/i.test(decoded)) return '../store/';
            const target = new URL(decoded, window.location.href);
            if (target.origin !== window.location.origin) return '../store/';
            const allowed = ['/checkout/', '/store/', '/account/', '/library/'];
            return allowed.some(path => target.pathname.startsWith(path)) ? decoded : '../store/';
        } catch {
            return '../store/';
        }
    };

    const returnTo = safeReturnPath(params.get('return'));
    const returnUrl = (extra = '') => {
        const query = new URLSearchParams(extra);
        if (returnTo) query.set('return', returnTo);
        return `${window.location.origin}${window.location.pathname}?${query.toString()}`;
    };

    const showMessage = (text, type = 'error') => {
        const el = $('account-message');
        el.textContent = text;
        el.className = `account-message ${type}`;
    };
    const clearMessage = () => {
        $('account-message').className = 'account-message is-hidden';
        $('account-message').textContent = '';
    };
    const showConfirmationActions = show => $('confirmation-actions').classList.toggle('is-hidden', !show);
    const setBusy = (value, label) => {
        busy = value;
        ['submit-button','signup-button','forgot-button','resend-confirmation-button','return-button','signout-button'].forEach(id => {
            const el = $(id);
            if (el) el.disabled = value;
        });
        if (label) $('submit-button').textContent = label;
    };

    const setMode = next => {
        mode = next;
        clearMessage();
        showConfirmationActions(false);
        const signup = next === 'signup';
        const forgot = next === 'forgot';
        const reset = next === 'reset';
        $('account-heading').textContent = reset ? 'Set a new password.' : forgot ? 'Reset your password.' : signup ? 'Create your account.' : 'Login';
        $('account-lead').textContent = reset
            ? 'Choose a new password for your Visual Tech Studio account.'
            : forgot
                ? 'Enter your account email and we will request a secure password reset link.'
                : signup
                    ? 'Create an account so verified purchases can be securely connected to your personal library.'
                    : 'Sign in to your account.';
        $('password-field').classList.toggle('is-hidden', forgot);
        $('confirm-password-field').classList.toggle('is-hidden', !signup && !reset);
        $('forgot-row').classList.toggle('is-hidden', next !== 'signin');
        $('submit-button').textContent = forgot ? 'Send reset link' : signup ? 'Create account' : reset ? 'Save new password' : 'Sign in';
        $('signup-button').textContent = signup || forgot || reset ? 'Back to sign in' : 'Create account';
        const formNote = $('form-note');
        if (formNote) {
            formNote.textContent = reset
                ? 'Use at least 8 characters. Your new password will replace the old one.'
                : signup
                    ? 'After creating your account, check your email and confirm your address before signing in.'
                    : forgot
                        ? 'For your security, we will not reveal whether an email is registered. If an account exists, a reset link will be sent.'
                        : '';
        }
        $('email').disabled = reset;
        $('email').required = !reset;
        $('password').required = !forgot;
        $('confirm-password').required = signup || reset;
    };

    const showSignedIn = user => {
        $('account-form').classList.add('is-hidden');
        $('signed-in-state').classList.remove('is-hidden');
        $('signed-in-email').textContent = user?.email || '';
        $('account-heading').textContent = "You're signed in.";
        $('account-lead').textContent = 'Your customer session is active. Continue when you are ready to return to your purchase or library.';
        $('return-button').textContent = returnTo.includes('/checkout/') ? 'Return to checkout' : returnTo.includes('/library/') ? 'Open my library' : 'Continue';
    };
    const showAuth = () => {
        $('account-form').classList.remove('is-hidden');
        $('signed-in-state').classList.add('is-hidden');
    };
    const getSession = async () => {
        const { data, error } = await client.auth.getSession();
        if (error) throw error;
        return data?.session || null;
    };

    const handleSession = async session => {
        if (mode === 'reset' || recoveryRequested) {
            if (session) {
                showAuth();
                setMode('reset');
            } else {
                showAuth();
                setMode('signin');
                showMessage('This password reset link is missing or has expired. Request a new one.');
            }
            return;
        }
        if (session) showSignedIn(session.user);
        else {
            showAuth();
            setMode(mode === 'signup' ? 'signup' : 'signin');
        }
    };

    const requestReset = async () => {
        if (!client || busy) return;
        clearMessage();
        const email = $('email').value.trim().toLowerCase();
        if (!/^\S+@\S+\.\S+$/.test(email)) {
            showMessage('Enter a valid email address first.');
            return;
        }
        setBusy(true, 'Sending…');
        try {
            const { error } = await client.auth.resetPasswordForEmail(email, { redirectTo: returnUrl('reset=1') });
            if (error) throw error;
            showMessage('If an account exists for this email, a password reset email has been requested. Check your inbox and spam folder.', 'success');
        } catch (error) {
            showMessage(error?.message || 'Unable to request a password reset. Please try again.');
        } finally {
            setBusy(false, 'Send reset link');
        }
    };

    const resendConfirmation = async () => {
        if (!client || busy) return;
        clearMessage();
        const email = $('email').value.trim().toLowerCase();
        if (!/^\S+@\S+\.\S+$/.test(email)) {
            showMessage('Enter the email address you used to create the account first.');
            $('email').focus();
            return;
        }
        setBusy(true, 'Sending…');
        try {
            const { error } = await client.auth.resend({
                type: 'signup',
                email,
                options: { emailRedirectTo: returnUrl() }
            });
            if (error) throw error;
            showMessage('A new confirmation email has been requested. Check your inbox and spam folder, then use the latest confirmation link.', 'success');
        } catch (error) {
            const text = error?.message || '';
            showMessage(/rate limit/i.test(text) ? 'Too many confirmation emails were requested. Please wait a little before trying again.' : text || 'Unable to resend the confirmation email. Please try again.');
        } finally {
            setBusy(false, mode === 'signin' ? 'Sign in' : 'Create account');
        }
    };

    const initialize = async () => {
        try {
            if (!window.VISUAL_TECH_AUTH_READY) throw new Error('Shared authentication client is unavailable.');
            client = await window.VISUAL_TECH_AUTH_READY;
            if (!client) throw new Error('Shared authentication client is unavailable.');

            client.auth.onAuthStateChange((event, session) => {
                if (event === 'PASSWORD_RECOVERY') {
                    setMode('reset');
                    showAuth();
                } else if (event === 'SIGNED_OUT') {
                    showAuth();
                    setMode('signin');
                } else if (event === 'SIGNED_IN' && session && !recoveryRequested) {
                    showSignedIn(session.user);
                }
            });

            const session = await getSession();
            if (window.location.hash.includes('access_token=')) {
                history.replaceState({}, document.title, window.location.pathname + window.location.search);
            }
            if (recoveryRequested) {
                setMode('reset');
                await handleSession(session);
            } else if (session) {
                showSignedIn(session.user);
                if (emailConfirmed) showMessage('Email confirmed successfully. You are now signed in.', 'success');
            } else {
                setMode(params.get('signup') === '1' ? 'signup' : 'signin');
            }
        } catch (error) {
            console.error('Visual Tech Studio account authentication failed:', error);
            showMessage('Account authentication is temporarily unavailable. Please try again shortly.');
        }
    };

    $('forgot-button').addEventListener('click', () => {
        setMode('forgot');
        $('email').focus();
    });
    let activeFace = 'front';

    const faceSelector = face => `.account-face-${face} [data-account-id]`;
    const setActiveFace = face => {
        document.querySelectorAll('.account-face').forEach(el => el.classList.remove('is-active'));
        const target = document.querySelector(`.account-face-${face}`);
        if (target) target.classList.add('is-active');
        activeFace = face;
    };
    const faceElement = (face, id) => document.querySelector(`.account-face-${face} [data-account-id="${id}"]`);
    const setModeOnFace = (face, nextMode) => {
        const previous = activeFace;
        activeFace = face;
        setMode(nextMode);
        activeFace = previous;
    };

    const flipAuthCard = nextMode => {
        const panel = $('account-panel');
        if (!panel || panel.classList.contains('is-flipping')) return;

        const targetFace = nextMode === 'signup' ? 'back' : 'front';
        const targetRotation = targetFace === 'back' ? 180 : 0;

        setModeOnFace(targetFace, nextMode);
        panel.classList.add('is-flipping');
        panel.style.transform = `perspective(1400px) rotateY(${targetRotation}deg)`;

        window.setTimeout(() => {
            setActiveFace(targetFace);
        }, 320);

        window.setTimeout(() => {
            panel.classList.remove('is-flipping');
            panel.style.transform = `perspective(1400px) rotateY(${targetRotation}deg)`;
            const email = $( 'email' );
            if (email) email.focus();
        }, 640);
    };

    $('signup-button').addEventListener('click', () => {
        flipAuthCard(mode === 'signin' ? 'signup' : 'signin');
    });
    $('resend-confirmation-button').addEventListener('click', resendConfirmation);
    $('return-button').addEventListener('click', () => { window.location.href = returnTo; });
    $('signout-button').addEventListener('click', async () => {
        if (!client || busy) return;
        setBusy(true, 'Signing out…');
        try {
            const { error } = await client.auth.signOut();
            if (error) throw error;
            showAuth();
            setMode('signin');
            showMessage('You have been signed out.', 'success');
        } catch (error) {
            showMessage(error?.message || 'Unable to sign out. Please try again.');
        } finally {
            setBusy(false, 'Sign in');
        }
    });

    $('account-form').addEventListener('submit', async event => {
        event.preventDefault();
        if (busy || !client) return;
        clearMessage();

        if (mode === 'forgot') {
            await requestReset();
            return;
        }

        const email = $('email').value.trim().toLowerCase();
        const password = $('password').value;
        const confirm = $('confirm-password').value;
        setBusy(true, mode === 'signup' ? 'Creating…' : mode === 'reset' ? 'Saving…' : 'Signing in…');

        try {
            if (mode === 'signup') {
                if (!/^\S+@\S+\.\S+$/.test(email)) throw new Error('Enter a valid email address.');
                if (password.length < 8) throw new Error('Your password must be at least 8 characters.');
                if (password !== confirm) throw new Error('Your passwords do not match.');
                const { data, error } = await client.auth.signUp({ email, password, options: { emailRedirectTo: returnUrl() } });
                if (error) throw error;
                if (data?.session) {
                    showSignedIn(data.session.user);
                    showMessage('Your account is ready.', 'success');
                } else {
                    setMode('signin');
                    $('email').value = email;
                    showConfirmationActions(true);
                    showMessage('Your account was created. Check your email and click the confirmation link before signing in.', 'success');
                }
            } else if (mode === 'reset') {
                if (password.length < 8) throw new Error('Your new password must be at least 8 characters.');
                if (password !== confirm) throw new Error('Your passwords do not match.');
                const { error } = await client.auth.updateUser({ password });
                if (error) throw error;
                showMessage('Password reset successful. You are now signed in.', 'success');
                const session = await getSession();
                if (session) setTimeout(() => showSignedIn(session.user), 500);
            } else {
                if (!/^\S+@\S+\.\S+$/.test(email)) throw new Error('Enter a valid email address.');
                if (!password) throw new Error('Enter your password.');
                const { data, error } = await client.auth.signInWithPassword({ email, password });
                if (error) throw error;
                showSignedIn(data.user);
                showMessage('Signed in successfully.', 'success');
            }
        } catch (error) {
            const text = error?.message || '';
            if (/email not confirmed/i.test(text)) {
                showConfirmationActions(true);
                showMessage('Your email has not been confirmed yet. Check your inbox for the confirmation link, or resend it below.');
            } else if (/already registered|already exists|user already/i.test(text)) {
                setMode('signin');
                $('email').value = email;
                showMessage('An account with this email already exists. Sign in instead, or use Forgot password if you cannot remember your password.');
            } else if (/invalid login credentials/i.test(text)) {
                showMessage('The email or password is incorrect. If you have not confirmed your email, confirm it first.');
            } else if (/password/i.test(text) && /weak|least|characters/i.test(text)) {
                showMessage('Choose a stronger password with at least 8 characters.');
            } else {
                showMessage(text || 'Something went wrong. Please try again.');
            }
        } finally {
            setBusy(false, mode === 'signup' ? 'Create account' : mode === 'reset' ? 'Save new password' : 'Sign in');
        }
    });

    initialize();
})();
</script>
</body>
</html>
